[package]
name = "glyphcull-host"
# 0.1.3: `FrameSink::capture_readback` + `capture_last_frame_readback` — the
# un-mapped readback seam the wasm binding maps asynchronously (D31).
# 0.1.4: `scroll_with_surface` — the viewport and the drawing surface decouple
# (the mobile host's pinch zoom keeps the surface at the window size while the
# zoomed viewport shrinks; the renderer maps the viewport into the full
# surface); the sink resize now uses device pixels (canvas × dpr, the
# `FrameSink::resize` contract) on every scroll — the desktop dpr≠1 path was
# configuring the surface at CSS pixels.
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GlyphCull document host: the platform-agnostic six-operation runtime (load/scroll/paint/select/copy/destroy) shared by the wasm and desktop bindings."
keywords = ["document", "gpu", "runtime", "compiled", "renderer"]
categories = ["rendering", "graphics", "wasm"]

[lints]
workspace = true

[dependencies]
glyphcull-core = { version = "0.1.1", path = "../glyphcull-core" }
glyphcull-render = { version = "0.1.0", path = "../glyphcull-render" }
ouroboros = "0.18"
