[package]
name = "glyphcull-ios"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GlyphCull iOS host: the mobile winit application over the shared re-attachable sink, loading a packaged .cull document from the app bundle — the same crate split as the Android host (entry + asset read only)."
keywords = ["document", "gpu", "runtime", "compiled", "ios"]
categories = ["rendering", "graphics", "gui"]

# cdylib: the app's embedded native library (the Xcode shell links it and
# calls `run_with` from the app's main); rlib keeps native builds/tests
# working inside the workspace (the same pattern as the other hosts).
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
glyphcull-core = { version = "0.1.1", path = "../glyphcull-core" }
glyphcull-desktop = { version = "0.1.3", path = "../glyphcull-desktop" }
glyphcull-host = { version = "0.1.4", path = "../glyphcull-host" }
glyphcull-mobile = { version = "0.1.2", path = "../glyphcull-mobile" }
