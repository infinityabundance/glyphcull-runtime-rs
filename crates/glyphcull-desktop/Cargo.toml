[package]
name = "glyphcull-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GlyphCull desktop host: a winit window that loads a .cull package and serves the identical six-operation runtime API (load/scroll/paint/select/copy/destroy) over wgpu."
keywords = ["document", "gpu", "runtime", "compiled", "winit"]
categories = ["rendering", "graphics", "gui"]

[lints]
workspace = true

[dependencies]
glyphcull-core = { version = "0.1.0", path = "../glyphcull-core" }
glyphcull-host = { version = "0.1.0", path = "../glyphcull-host" }
glyphcull-render = { version = "0.1.0", path = "../glyphcull-render" }
pollster = "0.4"
wgpu = "26"
# android-native-activity (not game-activity): the pure-Rust backend, so the
# crate builds on Android without the NDK games SDK; inert on other targets.
winit = { version = "0.30", features = ["android-native-activity"] }
