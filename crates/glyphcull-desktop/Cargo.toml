[package]
name = "glyphcull-desktop"
# 0.1.1: the `--screenshot`/`--size`/`--scroll` headless-capture mode
# (DESIGN.md D31) behind the demo's desktop smoke; HostLaunch + parse_args.
# 0.1.2: the re-attachable sink (DESIGN.md D29) — `DesktopSink` is public with
# `new_unsurfaced`/`attach`/`detach` (the Android suspend/resume lifecycle);
# the surface is an `Option`; the attach format-selection is pure and
# unit-tested; render 0.1.4's `retarget_target_format` keeps the pipeline in
# step with the attached surface.
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GlyphCull desktop host: a winit window that loads a .cull package and serves the identical six-operation runtime API (load/scroll/paint/select/copy/destroy) over wgpu."
keywords = ["document", "gpu", "runtime", "compiled", "winit"]
categories = ["rendering", "graphics", "gui"]

[lints]
workspace = true

[dependencies]
glyphcull-core = { version = "0.1.0", path = "../glyphcull-core" }
glyphcull-host = { version = "0.1.0", path = "../glyphcull-host" }
glyphcull-render = { version = "0.1.0", path = "../glyphcull-render" }
png = "0.17"
pollster = "0.4"
wgpu = "26"
# android-native-activity (not game-activity): the pure-Rust backend, so the
# crate builds on Android without the NDK games SDK; inert on other targets.
winit = { version = "0.30", features = ["android-native-activity"] }
