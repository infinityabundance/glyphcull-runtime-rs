[package]
name = "glyphcull-wasm"
# 0.2.0: the platform-agnostic host moved to glyphcull-host (shared with the
# desktop binding); this crate is now a thin wasm-bindgen layer over it.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GlyphCull wasm host: wasm-bindgen bindings for exactly load/scroll/paint/select/copy/destroy over glyphcull-host + glyphcull-render."

# The wasm binding is consumed as a wasm-bindgen cdylib (the demo and other
# hosts run wasm-bindgen-cli over it); the rlib keeps native builds/tests
# working inside the workspace.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
glyphcull-core = { version = "0.1.0", path = "../glyphcull-core" }
glyphcull-host = { version = "0.1.0", path = "../glyphcull-host" }
glyphcull-render = { version = "0.1.0", path = "../glyphcull-render" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }
# The webgl feature compiles wgpu's GL backend for the browser (WebGL2), so
# hosts can select WebGL as a fallback when WebGPU is unavailable.
wgpu = { version = "26", features = ["webgl"] }
