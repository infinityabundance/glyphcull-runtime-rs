[package]
name = "glyphcull-core"
# 0.1.1: clock generics accept ?Sized clocks (`&dyn Clock`), enabling the
# host's injectable-clock API for wasm (which has no std time).
# 0.1.2: the v1 compatibility rules (hardening pass) — flags bit 0 = critical
# (unknown noncritical sections skipped, critical ones rejected),
# canonical known-section order enforced, INFO required at the container.
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GlyphCull core: the platform-agnostic compiled-document runtime — the independent .cull reader, document model, chunk lifecycle, visibility, materialization, layout, glyph cache, selection, and draw list."

[lints]
workspace = true

[dependencies]
crc32fast = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
unicode-general-category = "1.0"
unicode-script = "0.5"

[dev-dependencies]
proptest = "1.5"
criterion = "0.5"

[[bench]]
name = "reader_parse"
harness = false

[[bench]]
name = "document_build"
harness = false

[[bench]]
name = "layout_golden"
harness = false

[[bench]]
name = "glyph_selection"
harness = false

[[bench]]
name = "draw_list_golden"
harness = false
