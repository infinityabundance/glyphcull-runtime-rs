[package]
name = "glyphcull-mobile"
# 0.1.1: the on-device D31 capture dump the emulator smoke validates
# (Android-only, once per process; pulled via run-as from the debug APK),
# plus the resumed/resize diagnostics. The APK manifest (demo repo) gained
# the NoTitleBar.Fullscreen theme and debuggable for the capture pull.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GlyphCull Android host: a winit application that loads a packaged .cull document from the APK assets and serves the identical six-operation runtime API (load/scroll/paint/select/copy/destroy) over wgpu, reusing the shared desktop sink."
keywords = ["document", "gpu", "runtime", "compiled", "android"]
categories = ["rendering", "graphics", "gui"]

# cdylib: the Android activity's native library (the `android_main` entry
# point); rlib keeps native builds/tests working inside the workspace (the
# same pattern as glyphcull-wasm).
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
glyphcull-core = { version = "0.1.1", path = "../glyphcull-core" }
glyphcull-desktop = { version = "0.1.3", path = "../glyphcull-desktop" }
glyphcull-host = { version = "0.1.3", path = "../glyphcull-host" }
pollster = "0.4"
# android-native-activity (not game-activity): the pure-Rust backend, so the
# crate builds without the NDK games SDK; inert on non-Android targets.
winit = { version = "0.30", features = ["android-native-activity"] }

# Android-only: `android-activity` provides the `AndroidApp` handle passed to
# `android_main` (winit's event loop needs it), and `ndk` provides the
# `AssetManager` that reads the packaged document from the APK assets. Target-
# gated so the crate (and the CI matrix: native, wasm32) never compiles the
# Android plumbing on non-Android hosts.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
ndk = "0.9"
