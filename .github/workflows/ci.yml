name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (native)
        run: cargo clippy --all-targets --all-features
      - name: Test (native)
        run: cargo test --all --all-targets
      - name: Build (wasm32)
        run: cargo build --all --target wasm32-unknown-unknown
      - name: Build (android aarch64)
        run: cargo build --all --target aarch64-linux-android
      - name: Build (android x86_64)
        run: cargo build --all --target x86_64-linux-android
      - name: Doc build
        run: cargo doc --all --no-deps
      - name: Bench smoke
        run: cargo bench --all -- --test
