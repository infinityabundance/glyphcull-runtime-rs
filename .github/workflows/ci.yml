name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (native)
        run: cargo clippy --all-targets --all-features
      - name: Test (native)
        run: cargo test --all --all-targets
      - name: Build (wasm32)
        run: cargo build --all --target wasm32-unknown-unknown
      # The wasm crate's `load` API is gated behind `cfg(web)`, which its build
      # script enables on wasm32; clippy here type-checks and lints the real
      # canvas-dependent path (native clippy above strips it).
      - name: Clippy (wasm32)
        run: cargo clippy --all --target wasm32-unknown-unknown
      # Android verifies crate readiness (ROADMAP 4.12): library targets only —
      # a bin would need the NDK linker, which the CI image does not carry.
      # glyphcull-mobile is excluded from the linked build for the same
      # reason (its cdylib is the Android activity library) and type-checked
      # separately below; the real NDK link happens in the Docker APK
      # pipeline (glyphcull-demo/docker/android-build.sh).
      - name: Build (android aarch64)
        run: cargo build --lib --all --exclude glyphcull-mobile --target aarch64-linux-android
      - name: Build (android x86_64)
        run: cargo build --lib --all --exclude glyphcull-mobile --target x86_64-linux-android
      # `cargo check` compiles the real android_main/asset entry (cfg
      # target_os = "android") without linking the cdylib.
      - name: Check (mobile aarch64)
        run: cargo check -p glyphcull-mobile --target aarch64-linux-android
      - name: Check (mobile x86_64)
        run: cargo check -p glyphcull-mobile --target x86_64-linux-android
      - name: Doc build
        run: cargo doc --all --no-deps
      - name: Bench smoke
        run: cargo bench --all -- --test
